<html>
    <head>
        <meta charset="utf-8">
        <title>GPA Calculator</title>
        <script>
            var wtQt = 30, wtGk = 20, wtCk = 50;

            function setCourse(c) {
                if (c == '1') { wtQt = 30; wtGk = 20; wtCk = 50; }
                else if (c == '2') { wtQt = 25; wtGk = 25; wtCk = 50; }
                else if (c == '3') { wtQt = 15; wtGk = 20; wtCk = 50; wtT=15;}
                document.getElementById('wtQt').innerHTML = wtQt + '%';
                document.getElementById('wtGk').innerHTML = wtGk + '%';
                document.getElementById('wtCk').innerHTML = wtCk + '%';
                xoa();
            }

            function tinh() {
                if (myform.qt.value == "" || myform.gk.value == "" || myform.ck.value == "") {
                    myform.ketqua1.value = 'Vui lòng nhập đầy đủ điểm QT, GK, CK';
                    document.getElementById('ketqua2').innerHTML = "<font color='red'>Chưa đủ dữ liệu</font>";
                    return;
                }
                var qt = eval(myform.qt.value);
                var gk = eval(myform.gk.value);
                var ck = eval(myform.ck.value);
                var total = (qt * wtQt / 100) + (gk * wtGk / 100) + (ck * wtCk / 100);
                total = Math.round(total * 100) / 100; // Làm tròn 2 chữ số thập phân
                myform.ketqua1.value = 'Điểm tổng: ' + total;
                document.getElementById('ketqua2').innerHTML = "<font color='blue'><b>" + total + "</b></font>";
            }

            function xoa() {
                myform.qt.value = "";
                myform.gk.value = "";
                myform.ck.value = "";
                myform.ketqua1.value = "";
                document.getElementById('ketqua2').innerHTML = "";
            }
        </script>
    </head>
    <body>
        <h3>GPA Calculator</h3>
        <form name="myform">
            <table>
                <tr>
                    <td>Chọn khóa học:</td>
                    <td>
                        <select id="courseSelect" onchange="setCourse(this.value)">
                            <option value="1">Course 1</option>
                            <option value="2">Course 2</option>
                            <option value="3">Course 3</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Quá trình (QT):</td>
                    <td>
                        <input type="number" name="qt"/>
                        &nbsp;
                        <span id="wtQt">30%</span>
                    </td>
                </tr>
                <tr>
                    <td>Giữa kỳ (GK):</td>
                    <td>
                        <input type="number" name="gk"/>
                        &nbsp;
                        <span id="wtGk">20%</span>
                    </td>
                </tr>
                <tr>
                    <td>Cuối kỳ (CK):</td>
                    <td>
                        <input type="number" name="ck"/>
                        &nbsp;
                        <span id="wtCk">50%</span>
                    </td>
                </tr>
                <tr>
                    <td>Kết quả:</td>
                    <td><input type="text" name="ketqua1" size="30"/></td>
                </tr>
                <tr>
                    <td>Kết quả số:</td>
                    <td id="ketqua2"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="button" value="Tính điểm" onclick="tinh()"/>
                        &nbsp;
                        <input type="button" value="Xóa" onclick="xoa()"/>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
