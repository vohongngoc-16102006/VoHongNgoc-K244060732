<html>
    <head>
        <meta charset="utf-8">
        <title>About me</title>
        <style>
            table { border-spacing: 5px; }
            td, th { padding: 5px; vertical-align: top; }
            tr { height: 25px; }
        </style>
    </head>
        <body style="background-color: #ccffff; font-family: Arial, sans-serif;">
            <div align="center">
                <img src="DeLong.jpg" alt="Profile Image">
            </div>
            <h1>Travel Expense Report</h1>
            <hr style="border: 1px solid #8B4513;"/>
            <form action="travel.html" method="post">
                <table>
                    <tr>
                        <td>1) First Name:</td>
                        <td><input type="text" name="first_name"></td>
                        <td>Last Name:</td>
                        <td><input type="text" name="last_name"></td>
                    </tr>
                    <tr>
                        <td>2) Social Security Number:</td>
                        <td><input type="text" name="ssn"></td>
                    </tr>
                    <tr>
                        <td>3) Department:</td>
                        <td>
                        <select name="dpm" style="width: 180px;">
                            <option value="Accounting">Accounting</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                        </select>
                    </td>
                    </tr>
                    <tr>
                        <td colspan="4">4) Describe the purpose of your trip:</td>
                    </tr>
                    <tr>
                        <td colspan="4">
                            <textarea name="purpose" rows="6" style="width: 100%; max-width: 1000px;" placeholder="Enter the purpose of your trip here..."></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4">5) Itemize your travel expenses:</td>
                    </tr>
                   <table border="1">
                    <tr>
                       <th>Date</th>
                       <th>Description</th>
                       <th>Category</th>
                       <th>Amount</th> 
                    </tr>
                    <tr>
                        <td><input type="date" name="expense_date_1"></td>
                        <td><input type="text" name="expense_desc_1"></td>
                        <td>
                            <select name="expense1">
                                <option value="Transportation">Meals</option>
                                <option value="Lodging">Lodging</option>
                                <option value="Meals">Transportation</option>
                                <option value="Other">Other</option>
                            </select>
                        </td>
                        <td><input type="text" name="expense_amount_1"></td>
                    <tr>
                        <td><input type="date" name="expense_date_2"></td>
                        <td><input type="text" name="expense_desc_2"></td>
                        <td>
                            <select name="expense2">
                                <option value="Transportation">Meals</option>
                                <option value="Lodging">Lodging</option>
                                <option value="Meals">Transportation</option>
                                <option value="Other">Other</option>
                            </select>
                        </td>
                        <td><input type="text" name="expense_amount_2"></td>
                    <tr>
                        <td><input type="date" name="expense_date_3"></td>
                        <td><input type="text" name="expense_desc_3"></td>
                        <td>
                            <select name="expense3">
                                <option value="Transportation">Meals</option>
                                <option value="Lodging">Lodging</option>
                                <option value="Meals">Transportation</option>
                                <option value="Other">Other</option>
                            </select>
                        </td>
                        <td><input type="text" name="expense_amount_3"></td>
                    <tr>
                        <td><input type="date" name="expense_date_4"></td>
                        <td><input type="text" name="expense_desc_4"></td>
                        <td>
                            <select name="expense4">
                                <option value="Transportation">Meals</option>
                                <option value="Lodging">Lodging</option>
                                <option value="Meals">Transportation</option>
                                <option value="Other">Other</option>
                            </select>
                        </td>
                        <td><input type="text" name="expense_amount_4"></td>
                   </table>
                  <tr>
                    <td colspan="4">6) Have you submitted your receipt?</td>
                  </tr>
                  <tr>
                    <td colspan="4" align="center" style="padding-top: 4px; padding-bottom: 8px;">
                        <input type="radio" id="receipt_yes" name="receipt" value="Yes">
                        <label for="receipt_yes">Yes</label>
                        <input type="radio" id="receipt_no" name="receipt" value="No">
                        <label for="receipt_no">No</label>
                    </td>
                  </tr>
                  <br/>
                  <tr style="height: 45px;">
                    <p>
                        <input type="submit" value="Submit travel expenses">
                        <input type="reset" value="Reset">
                    </p>
                  </tr>
                  <p>Question?Contact Debbie Larson in Accounting (ext. 2150).</p>
                </table>
          </form>
        </body>
</html>
