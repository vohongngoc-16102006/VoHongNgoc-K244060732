<html>
    <head>
        <title>About me</title>
        <script type="text/javascript">
            function xulygiai(hsa, hsb, ketqua)
            {
              kq=ptb1(hsa, hsb);
              ketqua.value=kq;
            }
            function ptb1(a, b)
            {
                return -b/a;
            }
            function thoat()
            {
                if (confirm("Bạn có chắc muốn thoát không?"))
                {
                    window.close();
                }
            }
        </script>
    </head>
        <body>
            <form>
                <table>
                    <tr>
                        <td colspan="2">Phương trình bậc 1</td>
                    </tr>
                    <tr>
                        <td>Hệ số a:</td>
                        <td>
                            <input type="number" id="hsa"/>
                        </td>
                    </tr>
                    <tr>
                        <td>Hệ số b:</td>
                        <td>
                            <input type="number" id="hsb"/>
                        </td>
                    </tr>
                    <tr>
                        <td>Kết quả:</td>
                        <td>
                            <input type="text" id="ketqua">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input type="button" value="Giải phương trình" onclick="xulygiai(hsa.value, hsb.value,ketqua)">
                            &nbsp;
                            <input type="button" value="Thoát" onclick="thoat()">
                    </td>
                    </tr>
                </table>
            </form>>
        </body>
</html>
