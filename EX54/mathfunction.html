<html>
    <head>
        <meta charset="utf-8">
        <title>About me</title>
        <script>
            function Max() {
                var a = Number(myform.a.value);
                var b = Number(myform.b.value);
                var c = Number(myform.c.value);
                myform.result.value = Math.max(a, b, c);
            }
            function Min() {
                var a = Number(myform.a.value);
                var b = Number(myform.b.value);
                var c = Number(myform.c.value);
                myform.result.value = Math.min(a, b, c);
            }
            function Sin() {
                var a = Number(myform.a.value);
                myform.result.value = Math.sin(a);
            }
            function Cos() {
                var a = Number(myform.a.value);
                myform.result.value = Math.cos(a);
            }
            function Pow() {
                var a = Number(myform.a.value);
                var b = Number(myform.b.value);
                myform.result.value = Math.pow(a,b);
            }
        </script>
    </head>
        <body>
            <form name="myform">
                <table border="1">
                    <tr>
                        <td>a: </td>
                        <td><input type="number" name="a"></td>
                    </tr>
                    <tr>
                        <td>b: </td>
                        <td><input type="number" name="b"></td>
                    </tr>
                    <tr>
                        <td>c: </td>
                        <td><input type="number" name="c"></td>
                    </tr>
                     <tr>
                        <td>result:</td>
                        <td><input type="number" name="result"></td>
                    </tr>
                    <tr>
                    <td colspan="2">
                        <button type="button" onclick="Max()">MAX</button>
                        <button type="button" onclick="Min()">MIN</button>
                        <button type="button" onclick="Sin()">sin(a)</button>
                        <button type="button" onclick="Cos()">Cos(a)</button>
                        <button type="button" onclick="Pow()">a^b</button>
                    </td>
                </table>
            </form>
        </body>
</html>
