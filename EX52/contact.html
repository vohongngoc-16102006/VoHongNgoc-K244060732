<html>
    <head>
        <meta charset="utf-8">
        <title>Contact Editorial Office</title>
    </head>
        <body>
            <form action="contact_process.html" method="get">
                <table>
                <tr>
                    <td colspan="2" style="font-size: 18px; font-weight: bold; padding-bottom: 15px;">
                        Contact the editorial office
                    </td>
                </tr>
               <tr>
                    <td colspan="2">
                        Full name <br>
                        <input type="text" name="full_name" style="width: 100%; box-sizing: border-box;">
                    </td>
                </tr>

                <tr>
                    <td style="width: 50%;">
                        Email <br>
                        <input type="text" name="email">
                    </td>
                    <td style="width: 50%;">
                        Send to <br>
                        <select name="send_to">
                            <option value="Editorial board">Editorial board</option>
                            <option value="News Department">News Department</option>
                            <option value="Board of Perspectives">Board of Perspectives</option>
                            <option value="World Board">World Board</option>
                            <option value="Business Department">Business Department</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td style="width: 50%;">
                        Title <br>
                        <input type="text" name="title">
                    </td>
                    <td></td> </tr>

                <tr>
                    <td colspan="2">
                        Content <br>
                        <textarea name="content" rows="6" style="width: 100%; box-sizing: border-box;"></textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="padding-top: 15px; padding-bottom: 15px;">
                        <input type="submit" value="Send" style="background-color: #8a2545; color: white; border: none; padding: 10px 25px; font-weight: bold; border-radius: 3px; cursor: pointer; box-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
                    </td>
                </tr>
                </table>
            </form>
        </body>
</html>
