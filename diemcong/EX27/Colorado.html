<html>
    <head>
        <meta charset="utf-8">
        <title>About me</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            #top {
                flex: 0 0 15%;
                min-height: 120px;
            }
            #main {
                flex: 1;
                display: flex;
                min-height: 0;
            }
            #menu {
                width: 25%;
                min-width: 220px;
                border-right: 1px solid #ccc;
                box-sizing: border-box;
            }
            #content {
                flex: 1;
                min-height: 0;
            }
            iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
        </style>
    </head>
    <body>
        <div id="top">
            <iframe src="logo.html" title="Logo"></iframe>
        </div>
        <div id="main">
            <div id="menu">
                <iframe src="link.html" title="Menu"></iframe>
            </div>
            <div id="content">
                <iframe src="Lessons.html" name="main_content" title="Content"></iframe>
            </div>
        </div>
    </body>
</html>
