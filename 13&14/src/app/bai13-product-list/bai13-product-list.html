<h2>Bài 13 - Danh sách sản phẩm</h2>

<table border="1" cellpadding="8" cellspacing="0">
  <thead>
    <tr>
      <th>Mã sản phẩm</th>
      <th>Tên sản phẩm</th>
      <th>Giá</th>
      <th>Ảnh</th>
      <th>Chi tiết</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of products">
      <td>{{ p.ProductId }}</td>
      <td>{{ p.ProductName }}</td>
      <td>{{ p.Price }}</td>
      <td><img [src]="p.Image" [alt]="p.ProductName" width="70"></td>
      <td>
        <button type="button" (click)="viewDetail(p.ProductId)">
          Details
        </button>
      </td>
    </tr>
  </tbody>
</table>
