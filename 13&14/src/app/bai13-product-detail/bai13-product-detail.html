<h2>Bài 13 - Chi tiết sản phẩm</h2>

<button type="button" (click)="goBack()">Go Back</button>

<table *ngIf="product; else notFound" border="1" cellpadding="8">
  <tr>
    <th>ID</th>
    <td>{{ product.ProductId }}</td>
  </tr>
  <tr>
    <th>Name</th>
    <td>{{ product.ProductName }}</td>
  </tr>
  <tr>
    <th>Price</th>
    <td>{{ product.Price }}</td>
  </tr>
  <tr>
    <th>Picture</th>
    <td><img [src]="product.Image" [alt]="product.ProductName" width="120"></td>
  </tr>
</table>

<ng-template #notFound>
  <p>Không tìm thấy sản phẩm.</p>
</ng-template>
